name: Micro Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  NODE_VERSION: 22
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  validate-apps:
    name: Build & Verify (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: 
          # - remote-angular
          # - remote-react
          # - remote-vue
          - host

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies (${{ matrix.app }})
        working-directory: ./${{ matrix.app }}
        run: npm ci

      - name: Run Tests (if available)
        working-directory: ./${{ matrix.app }}
        run: |
          # Automatically skips if no test script is defined in package.json
          if npm run | grep -q "test"; then
            npm run test -- --ci --coverage=false
          else
            echo "No test script found, skipping tests."
          fi

      - name: Build Application (${{ matrix.app }})
        working-directory: ./${{ matrix.app }}
        run: npm run build