name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - host/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-host.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  REMOTE_REACT_URL: ${{ vars.REMOTE_REACT_URL }}
  REMOTE_VUE_URL: ${{ vars.REMOTE_VUE_URL }}
  REMOTE_ANGULAR_URL: ${{ vars.REMOTE_ANGULAR_URL }}
  REMOTE_NUXT_URL: ${{ vars.REMOTE_NUXT_URL }}

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies & Build
        # working-directory: ./host
        run: |
          npm ci -w host --include-workspace-root --ignore-scripts
          npm run build -w host

      - name: SPA fallback (404.html) and .nojekyll
        run: |
          cp host/dist/index.html host/dist/404.html
          touch host/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'host/dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4