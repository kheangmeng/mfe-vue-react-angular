name: Deploy Host & Remotes to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Remote React
        run: npm run build -w remote-react
        env:
          NODE_ENV: production
          BASE_PATH: /${{ github.event.repository.name }}/remote-react/

      - name: Build Remote Vue
        run: npm run build -w remote-vue
        env:
          NODE_ENV: production
          BASE_PATH: /${{ github.event.repository.name }}/remote-vue/

      - name: Build Remote Angular
        run: npm run build -w remote-angular
        env:
          NODE_ENV: production
          BASE_PATH: /${{ github.event.repository.name }}/remote-angular/

      - name: Build Host application
        run: npm run build -w host
        env:
          NODE_ENV: production
          BASE_PATH: /${{ github.event.repository.name }}/
          REMOTE_REACT_URL: /${{ github.event.repository.name }}/remote-react/remoteEntry.js
          REMOTE_VUE_URL: /${{ github.event.repository.name }}/remote-vue/remoteEntry.js
          REMOTE_ANGULAR_URL: /${{ github.event.repository.name }}/remote-angular/remoteEntry.js

      - name: Assemble remotes into host dist
        run: |
          mkdir -p host/dist/remote-react host/dist/remote-vue host/dist/remote-angular
          cp -r remote-react/dist/* host/dist/remote-react/
          cp -r remote-vue/dist/* host/dist/remote-vue/
          cp -r remote-angular/dist/* host/dist/remote-angular/
          cp host/dist/index.html host/dist/404.html
          touch host/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: host/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        