name: Deploy Host to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'host/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Host Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Host application
        run: npm run build -w host
        env:
          NODE_ENV: production
          BASE_PATH: /${{ github.event.repository.name }}/
          REMOTE_REACT_URL: ${{ vars.REMOTE_REACT_URL }}
          REMOTE_VUE_URL: ${{ vars.REMOTE_VUE_URL }}
          REMOTE_ANGULAR_URL: ${{ vars.REMOTE_ANGULAR_URL }}

      - name: Setup SPA 404 fallback and disable Jekyll
        run: |
          cp host/dist/index.html host/dist/404.html
          touch host/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: host/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
